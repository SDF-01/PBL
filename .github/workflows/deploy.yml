name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Clean npm cache
        run: |
          npm cache clean --force
          rm -rf ~/.npm/_cacache

      - name: Install dependencies
        run: npm ci --prefer-online

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build static export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY:             "AIzaSyC3r-AQYUqJBIfMjKDFdgK6bLenEc8Ncko"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:         "pickleleauge.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID:          "pickleleauge"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:      "pickleleauge.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "481849102562"
          NEXT_PUBLIC_FIREBASE_APP_ID:              "1:481849102562:web:ec4ba61bcf1e5eaa1fcebb"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:      "G-KD1JTE4ET6"
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY:           ${{ secrets.RECAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_APP_VERSION: "0.1.0"
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.run_number }}
        run: npm run build

      # ---- Firebase backend deploys ---------------------------------------
      # Functions, Firestore rules, Firestore indexes, and Storage rules are
      # deployed via the Firebase CLI (the hosting action below only handles
      # hosting). Each step is idempotent — unchanged config is a no-op.
      #
      # Order matters: functions first so any tightened rules don't lock
      # out callable paths that haven't shipped yet; rules + indexes next;
      # storage last (the only one with no cross-dependencies).

      - name: Build Cloud Functions
        run: |
          cd functions
          npm ci --prefer-online
          npm run build

      # This step used to only check the secret was non-empty and write it to
      # disk, then call itself "Authenticate". It never contacted Google, so an
      # expired, revoked, or malformed key passed it and failed several steps
      # later with an unattributable "exit code 1". The preflight below makes a
      # real authenticated API call so credential problems fail HERE, named.
      - name: Authenticate Firebase CLI
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          if ! printf '%s' "$SA_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON (check for truncation or added quotes)"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "service account: $(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/sa.json"))["client_email"])')"

      # Non-blocking on purpose. A deploy-scoped service account may legitimately
      # lack projects.list while still being able to deploy, and this step must
      # never mask the deploy's own error by short-circuiting the job. It runs
      # purely to put a real authenticated round-trip in the log.
      - name: Verify Firebase credentials
        continue-on-error: true
        run: |
          npx firebase-tools projects:list --non-interactive

      - name: Deploy Cloud Functions
        run: npx firebase-tools deploy --only functions --project pickleleauge --non-interactive --force --debug

      # firebase-debug.log holds the underlying HTTP status and API error body,
      # which is the only place the real cause of a functions deploy failure
      # appears. Without this the job reports nothing but "exit code 1".
      - name: Dump Firebase debug log on failure
        if: failure()
        run: |
          echo "===== firebase-debug.log (tail) ====="
          tail -n 300 firebase-debug.log 2>/dev/null || echo "(no firebase-debug.log produced)"
          # Job logs need an authenticated token to read, but annotations are
          # exposed on the public check-runs API. Emitting each matching line as
          # its own annotation makes the real cause visible without log access.
          if [ -f firebase-debug.log ]; then
            grep -aiE "error|denied|billing|not enabled|HTTP Error|quota|PERMISSION" firebase-debug.log | head -n 6 > deploy-errors.txt || true
            while IFS= read -r line; do
              echo "::error title=Functions deploy::${line}"
            done < deploy-errors.txt
          fi

      - name: Deploy Firestore rules and indexes
        run: npx firebase-tools deploy --only firestore:rules,firestore:indexes --project pickleleauge --non-interactive --force

      - name: Deploy Storage rules
        run: npx firebase-tools deploy --only storage --project pickleleauge --non-interactive --force

      # ---- Hosting --------------------------------------------------------
      # Kept as a separate action for the PR-preview channel features.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: pickleleauge
