name: Deploy to Firebase

# Two jobs:
#   verify  runs on every pull request and every push to main. It is the check
#           branch protection should require, so code that does not typecheck,
#           test, or build is stopped before it reaches main.
#   deploy  runs only on main, only after verify passes, and ships the exact
#           static export verify built.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: verify-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Cloud Functions dependencies
        run: npm --prefix functions ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The command service compiles from functions/src for both Netlify and
      # Cloud Functions, so a type error there must fail the check too.
      - name: Build command service
        run: npm --prefix functions run build

      - name: Build static export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY:             "AIzaSyC3r-AQYUqJBIfMjKDFdgK6bLenEc8Ncko"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:         "pickleleauge.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID:          "pickleleauge"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:      "pickleleauge.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "481849102562"
          NEXT_PUBLIC_FIREBASE_APP_ID:              "1:481849102562:web:ec4ba61bcf1e5eaa1fcebb"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID:      "G-KD1JTE4ET6"
          # Only read when App Check is enforced, which it currently is not.
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY:           ${{ secrets.RECAPTCHA_SITE_KEY }}
          # Base URL of the privileged command service (see COMMAND_SERVICE.md).
          # Set the repository variable COMMANDS_BASE_URL to your host, e.g.
          # https://<site>.netlify.app/api. Until it is set, privileged actions
          # fail with a clear "not configured" message rather than silently.
          NEXT_PUBLIC_COMMANDS_BASE_URL:            ${{ vars.COMMANDS_BASE_URL }}
          NEXT_PUBLIC_APP_VERSION: "0.1.0"
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.run_number }}
        run: npm run build

      - name: Warn if the command service URL is missing
        if: github.ref == 'refs/heads/main' && vars.COMMANDS_BASE_URL == ''
        run: echo "::warning::Repository variable COMMANDS_BASE_URL is not set, so privileged actions on the deployed site will report 'not configured'."

      - name: Upload static export
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          retention-days: 3

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Never run two production deploys at once, and never cancel one midway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Installs the pinned firebase-tools from devDependencies, so every deploy
      # uses the same CLI version rather than whatever npx fetches that day.
      - name: Install dependencies
        run: npm ci

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      # Fails here, named, if the secret is missing or mangled, instead of
      # several steps later with an unattributed "exit code 1".
      - name: Authenticate Firebase CLI
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set"
            exit 1
          fi
          if ! printf '%s' "$SA_JSON" | python3 -c 'import json,sys; json.load(sys.stdin)' 2>/dev/null; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON (check for truncation or added quotes)"
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          echo "service account: $(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP"'/sa.json"))["client_email"])')"

      # Cloud Functions require the Blaze plan, and this project is on Spark,
      # so these steps are skipped and the identical commands are served by the
      # Netlify host instead (netlify/functions + functions/src/server). See
      # COMMAND_SERVICE.md.
      #
      # To switch back: enable Blaze, then set the repository variable
      # DEPLOY_FUNCTIONS=true. No code change is required.
      - name: Install Cloud Functions dependencies
        if: vars.DEPLOY_FUNCTIONS == 'true'
        run: npm --prefix functions ci

      - name: Deploy Cloud Functions
        if: vars.DEPLOY_FUNCTIONS == 'true'
        run: npx firebase deploy --only functions --project pickleleauge --non-interactive --force --debug

      # firebase-debug.log holds the underlying API error, which is the only
      # place the real cause of a functions deploy failure appears. Each line is
      # emitted as an annotation so it is readable without opening the logs.
      - name: Show Cloud Functions deploy error
        if: failure() && vars.DEPLOY_FUNCTIONS == 'true'
        run: |
          if [ ! -f firebase-debug.log ]; then
            echo "(no firebase-debug.log produced)"
            exit 0
          fi
          tail -n 300 firebase-debug.log
          grep -aE "^\[error\]|HTTP Error|FirebaseError|billing|not been used|is disabled" firebase-debug.log \
            | tail -n 8 \
            | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error title=Functions deploy::${line}"
              done

      - name: Deploy Firestore rules and indexes
        run: npx firebase deploy --only firestore:rules,firestore:indexes --project pickleleauge --non-interactive --force

      - name: Deploy Storage rules
        run: npx firebase deploy --only storage --project pickleleauge --non-interactive --force

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: pickleleauge
