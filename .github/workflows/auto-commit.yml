name: Auto Commit and Push

# NOTE: the nightly `schedule:` trigger was removed deliberately.
#
# This job runs `git add .` and commits whatever it finds. With no generation
# step wired up it had nothing to commit, but it was scheduled to run every
# night with `contents: write` — so the moment anyone added a build step that
# emits files into the working tree, it would start pushing them to main
# unreviewed. Manual dispatch keeps the scaffolding available without leaving
# an unattended writer pointed at the default branch.
#
# Before re-enabling `schedule:`, replace the placeholder step below with a
# real generation command and narrow `git add .` to just the paths it emits.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Generate or update files
        run: |
          # TODO: replace this command with the actual generation step that updates repo files
          # Example: npm ci && npm run generate
          echo "No generation step configured yet."

      - name: Commit changes
        id: commit
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: automated commit from GitHub Actions"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push changes
        if: steps.commit.outputs.changed == 'true'
        run: git push
